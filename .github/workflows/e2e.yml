name: E2E

# Gates a PR on the golden-path E2E suite (e2e/) before it can merge to main. Runs a locally
# built-and-started server in the CI runner, not a live Vercel Preview deployment — avoids
# depending on Vercel's own deployment-webhook timing.
#
# CI runs against its own dedicated Turso database (issue #28), not production — provisioned
# 2026-08-27 via the same Vercel Marketplace Turso integration as the main database, connected
# only to the unused "development" Vercel environment so it's fully decoupled from
# Preview/Production. Credentials live as repository secrets (TURSO_DATABASE_URL/
# TURSO_AUTH_TOKEN), not pulled from Vercel at all — this also drops the VERCEL_TOKEN/
# `vercel env pull` dependency the old shared-DB setup needed. ORGANISER_PIN/CRON_SECRET are
# also repository secrets (same values as production today — only the database differs; CI's
# app build and CI's own tests both read the same secret, so they only need to agree with each
# other, not with production).

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --ignore-scripts (issue #28): blocks a compromised/typosquatted transitive dependency's
      # postinstall hook from running arbitrary code during install — this runner holds real
      # secrets a few steps below. Verified 2026-08-27 that no dependency this workflow actually
      # needs relies on an install-time script (the one real postinstall in the tree,
      # unrs-resolver's, belongs to eslint-import-resolver-typescript — only used by
      # `npm run lint`, which this workflow never runs).
      - run: npm ci --ignore-scripts

      - name: Write .env.local from repository secrets
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          ORGANISER_PIN: ${{ secrets.ORGANISER_PIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          cat > .env.local <<EOF
          TURSO_DATABASE_URL=$TURSO_DATABASE_URL
          TURSO_AUTH_TOKEN=$TURSO_AUTH_TOKEN
          ORGANISER_PIN=$ORGANISER_PIN
          CRON_SECRET=$CRON_SECRET
          EOF

      - name: Apply pending migrations
        run: npm run db:migrate

      - run: npm run build

      - name: Start server
        # Output redirected to a file: GitHub Actions stops capturing a backgrounded (`&`)
        # process's output once the step that launched it exits. "Print server log" below cats
        # this file so it's visible regardless of outcome.
        run: |
          npm run start > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready in time" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Python)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run E2E suite
        run: python e2e/run.py

      - name: Clean up test registrations
        # test_registration.py's golden path (and test_rate_limit.py's throttle spec) submit
        # real rows to the CI-only Turso database — always remove them, even if the suite itself
        # failed above. Cheap and self-contained now that this is CI's own database, not
        # production, but still good hygiene: an unbounded CI database is still a database.
        if: always()
        run: npm run db:cleanup-test-data

      - name: Print server log
        if: always()
        run: cat /tmp/server.log
