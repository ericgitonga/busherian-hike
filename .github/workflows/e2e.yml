name: E2E

# Gates a PR on the golden-path E2E suite (e2e/) before it can merge to main. Runs a locally
# built-and-started server in the CI runner, not a live Vercel Preview deployment — avoids
# depending on Vercel's own deployment-webhook timing. Real Turso credentials are still pulled
# in (there's only one database — no dev/prod split for this one-off) so registration submits
# actually persist during the run, same as umoja-voices' pattern. Requires a VERCEL_TOKEN
# repository secret (Vercel dashboard -> Account Settings -> Tokens) with access to the
# egm2/busherian-hike project; org/project IDs below are plain identifiers (same ones in the
# gitignored .vercel/project.json), not secrets.

on:
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: team_zqkuLyNQ340W09pXdT0og99l
  VERCEL_PROJECT_ID: prj_Gt5jn4hYV4wKn4tMbhoARrNoPfX8

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Debug token length
        run: echo -n "${{ secrets.VERCEL_TOKEN }}" | wc -c

      - name: Debug whoami (no scope)
        run: npx vercel whoami --token=${{ secrets.VERCEL_TOKEN }}

      - name: Debug teams list
        run: npx vercel teams ls --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull env vars
        run: npx vercel env pull .env.local --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Apply pending migrations
        run: npm run db:migrate

      - run: npm run build

      - name: Start server
        # Output redirected to a file: GitHub Actions stops capturing a backgrounded (`&`)
        # process's output once the step that launched it exits. "Print server log" below cats
        # this file so it's visible regardless of outcome.
        run: |
          npm run start > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready in time" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Python)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run E2E suite
        run: python e2e/run.py

      - name: Print server log
        if: always()
        run: cat /tmp/server.log
