name: Unit

# Gates a PR on the Vitest unit suite (colocated *.test.ts files) — fast, pure-logic coverage,
# alongside (not instead of) e2e.yml's Playwright suite. No build, server, or browser install
# needed.

on:
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # --ignore-scripts (issue #28): blocks a compromised/typosquatted transitive dependency's
      # postinstall hook from running arbitrary code during install. Verified 2026-08-27 that no
      # dependency this workflow actually needs relies on an install-time script (the one real
      # postinstall in the tree, unrs-resolver's, belongs to eslint-import-resolver-typescript —
      # only used by `npm run lint`, which this workflow never runs).
      - run: npm ci --ignore-scripts

      - name: Run unit test suite
        run: npm run test
